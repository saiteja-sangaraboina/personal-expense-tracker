version: '3.8'

services:
  mongodb:
    image: mongo:7-jammy
    container_name: expense_mongodb_dev
    ports:
      - "27017:27017"
    volumes:
      - mongo_dev_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: expense_backend_dev
    command: npm run dev
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/expense_tracker_dev
      JWT_SECRET: dev_jwt_secret_key_12345
      FRONTEND_URL: http://localhost:5173
    depends_on:
      - mongodb

volumes:
  mongo_dev_data:
